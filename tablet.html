<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MIC 設備管理員後台</title>
    <style>
        :root { --primary: #2c3e50; --secondary: #3498db; --bg: #f4f7f6; }
        body { 
            font-family: "Microsoft JhengHei", sans-serif; background: #f0f2f5; margin: 0; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; width: 100vw; box-sizing: border-box;
        }

        .container { 
            background: white; width: 85%; max-width: 500px; padding: 40px; 
            border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            text-align: center;
        }

        h2 { color: #2c3e50; font-size: 24px; margin-bottom: 10px; font-weight: bold; }
        p.subtitle { color: #7f8c8d; font-size: 15px; margin-bottom: 30px; }

        .form-group { text-align: left; margin-bottom: 25px; }
        .form-group label { display: block; color: #34495e; font-weight: bold; margin-bottom: 8px; font-size: 16px; }
        
        input[type="text"], input[type="password"] { 
            width: 100%; padding: 15px; font-size: 16px; border: 1px solid #ddd; 
            border-radius: 10px; background: #f9f9f9; box-sizing: border-box; outline: none;
            transition: border 0.3s;
        }
        input[type="text"]:focus, input[type="password"]:focus { border-color: #3498db; background: #fff;}

        .btn-group { display: flex; gap: 15px; margin-top: 20px; }
        button { 
            flex: 1; padding: 15px; font-size: 18px; font-weight: bold; cursor: pointer; 
            border: none; border-radius: 10px; transition: 0.2s; color: white;
        }
        .btn-save { background: #3498db; }
        .btn-save:active { transform: scale(0.98); background: #2980b9; }
        .btn-back { background: #95a5a6; }
        .btn-back:active { transform: scale(0.98); background: #7f8c8d; }

        /* 畫面切換控制 */
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .note { font-size: 13px; color: #e74c3c; margin-top: 10px; text-align: left;}
    </style>
</head>
<body>

<div id="screen-setup" class="container screen">
    <h2>設備初次設定</h2>
    <p class="subtitle">請為此平板/設備設定專屬據點與密碼</p>
    
    <div class="form-group">
        <label>📍 據點名稱 (可自由填寫)</label>
        <input type="text" id="setup_loc" placeholder="例如：新竹 6F-3、頭份廠 1F">
    </div>
    <div class="form-group">
        <label>🔒 設定管理密碼</label>
        <input type="password" id="setup_pwd" placeholder="請自訂一組密碼">
        <div class="note">* 此密碼僅存在這台設備中，各設備獨立管理。</div>
    </div>
    
    <div class="btn-group">
        <button class="btn-save" onclick="initialSetup()">完成設定並進入</button>
    </div>
</div>

<div id="screen-login" class="container screen">
    <h2>設備管理登入</h2>
    <p class="subtitle" id="login_subtitle">請輸入此設備的管理密碼</p>
    
    <div class="form-group">
        <label>🔒 管理密碼</label>
        <input type="password" id="login_pwd" placeholder="請輸入密碼">
    </div>
    
    <div class="btn-group">
        <button class="btn-back" onclick="goToVisitor()">返回訪客頁</button>
        <button class="btn-save" onclick="login()">登入</button>
    </div>
</div>

<div id="screen-admin" class="container screen">
    <h2>⚙️ 據點管理設定</h2>
    <p class="subtitle">修改後將自動同步至訪客畫面的 QR Code</p>
    
    <div class="form-group">
        <label>📍 當前據點名稱</label>
        <input type="text" id="admin_loc" placeholder="輸入要變更的名稱">
    </div>
    <div class="form-group">
        <label>🔑 變更密碼 (若不修改請留空)</label>
        <input type="password" id="admin_pwd" placeholder="輸入新密碼">
    </div>
    
    <div class="btn-group">
        <button class="btn-back" onclick="goToVisitor()">取消返回</button>
        <button class="btn-save" onclick="saveSettings()">💾 儲存並套用</button>
    </div>
</div>

<script>
    // 網頁載入時判斷要顯示哪個畫面
    window.onload = function() {
        const storedPwd = localStorage.getItem('mic_admin_pwd');
        const storedLoc = localStorage.getItem('mic_location');

        if (!storedPwd) {
            // 沒有密碼紀錄，進入初次設定
            showScreen('screen-setup');
        } else {
            // 有密碼紀錄，進入登入畫面，並提示當前設備
            document.getElementById('login_subtitle').innerText = `當前設備：${storedLoc || '未命名據點'}`;
            showScreen('screen-login');
        }
    };

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // 執行初次設定
    function initialSetup() {
        const loc = document.getElementById('setup_loc').value.trim();
        const pwd = document.getElementById('setup_pwd').value.trim();
        
        if (!loc || !pwd) {
            alert("⚠️ 據點名稱與密碼皆為必填！");
            return;
        }
        
        // 寫入平板記憶體
        localStorage.setItem('mic_location', loc);
        localStorage.setItem('mic_admin_pwd', pwd);
        
        alert("✅ 設備設定成功！");
        goToVisitor(); // 設定完直接跳回訪客頁面
    }

    // 執行登入
    function login() {
        const storedPwd = localStorage.getItem('mic_admin_pwd');
        const inputPwd = document.getElementById('login_pwd').value;
        
        if (inputPwd === storedPwd) {
            // 登入成功，將目前地點帶入輸入框
            document.getElementById('admin_loc').value = localStorage.getItem('mic_location') || '';
            document.getElementById('admin_pwd').value = ''; // 密碼欄位留空
            showScreen('screen-admin');
        } else {
            alert("❌ 密碼錯誤！請重新輸入。");
            document.getElementById('login_pwd').value = '';
        }
    }

    // 儲存設定變更
    function saveSettings() {
        const newLoc = document.getElementById('admin_loc').value.trim();
        const newPwd = document.getElementById('admin_pwd').value.trim();
        
        if (!newLoc) {
            alert("⚠️ 據點名稱不可為空白！");
            return;
        }
        
        // 變更地點
        localStorage.setItem('mic_location', newLoc);
        
        // 若有填寫新密碼，則更新密碼
        if (newPwd !== "") {
            localStorage.setItem('mic_admin_pwd', newPwd);
        }
        
        alert("✅ 設定已更新！將為您切換回訪客畫面。");
        goToVisitor();
    }

    // 跳轉回訪客頁面
    function goToVisitor() {
        window.location.href = 'visitor.html';
    }
</script>

</body>
</html>
