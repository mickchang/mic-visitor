<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MIC 櫃台訪客管理看板</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root { --primary: #2c3e50; --secondary: #3498db; --bg: #f4f7f6; }
        body { 
            font-family: "Microsoft JhengHei", sans-serif; background: var(--bg); margin: 0; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; width: 100vw; position: relative;
        }
        
        /* 標題區 */
        .header-area { 
            width: 90%; max-width: 1200px; padding: 40px 0 20px 0; 
            align-self: flex-start; margin-left: 5%; 
        }
        .header-mic { color: red; font-weight: bold; font-size: 48px; font-family: Arial, sans-serif; line-height: 1; }
        .header-sub { color: #c0392b; font-weight: bold; font-size: 24px; margin-top: 10px; }
        .header-location { color: #7f8c8d; font-size: 18px; font-weight: bold; margin-top: 5px; }

        /* 卡片容器 */
        .container { 
            background: white; width: 90%; max-width: 1200px; padding: 30px; 
            border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            margin-bottom: 50px;
        }

        .system-controls { 
            background: #f8f9fa; padding: 20px; border-radius: 12px; 
            margin-bottom: 25px; display: flex; align-items: center; justify-content: center; gap: 15px;
            border: 1px solid #eee;
        }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; background: #95a5a6; display: inline-block; }
        .status-online { background: #27ae60; box-shadow: 0 0 8px #27ae60; }
        
        table { width: 100%; border-collapse: collapse; font-size: 17px; }
        th, td { border: 1px solid #eee; padding: 15px 10px; text-align: center; }
        th { background: #2c3e50; color: white; font-weight: bold; }
        tbody tr:nth-child(even) { background: #fafafa; }

        .new-row { animation: highlight 3s ease-out; }
        @keyframes highlight { 0% { background-color: #fff9c4; } 100% { background-color: transparent; } }

        input[type="text"], input[type="password"], input[type="date"] { padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; transition: 0.2s; }
        .btn-save { background: #3498db; color: white; }
        .btn-start { background: #e67e22; color: white; }
        
        /* 管理員後台彈窗樣式 */
        .admin-trigger { position: fixed; bottom: 20px; right: 30px; cursor: pointer; color: #bdc3c7; font-size: 14px; font-weight: bold; z-index: 100; }
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center; }
        .modal-box { background:white; padding:30px; border-radius:15px; width:90%; max-width:800px; max-height: 80vh; overflow-y: auto; }
        .admin-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .admin-section { border: 1px solid #eee; padding: 15px; border-radius: 10px; }

        /* 全螢幕登入防護罩 */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #f0f2f5; z-index: 9999; display: flex;
            justify-content: center; align-items: center; flex-direction: column;
        }
        .login-box {
            background: white; padding: 40px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: 85%; max-width: 400px;
        }
        .login-box input {
            width: 90%; padding: 15px; font-size: 18px; border: 1px solid #ddd;
            border-radius: 10px; margin-bottom: 20px; text-align: center;
        }
        .login-box button {
            background: #3498db; color: white; padding: 15px; width: 100%;
            border: none; border-radius: 10px; font-size: 18px; cursor: pointer;
        }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h2 id="loginTitle" style="color:#2c3e50; margin-top:0;">🔒 系統登入</h2>
        <p id="loginHint" style="color:#7f8c8d; font-size:14px;">系統載入中...</p>
        <input type="password" id="adminPw" placeholder="請輸入密碼" onkeypress="if(event.key === 'Enter') verifyLogin()">
        <button onclick="verifyLogin()">確認 / Enter</button>
    </div>
</div>

<div class="header-area">
    <div class="header-mic">MIC</div>
    <div class="header-sub">帆宣系統科技訪客登記表</div>
    <div class="header-location" id="displayLocation">- 載入中 -</div>
</div>

<div class="container">
    <div class="system-controls">
        <span class="status-dot" id="statusDot"></span>
        <span id="connStatus" style="font-weight: bold; color: #7f8c8d;">系統準備就緒</span>
        <span style="margin-left: 20px; font-weight: bold; color: #34495e;">據點設定：</span>
        <input type="text" id="admin_loc" value="新竹 6F">
        <button class="btn-save" onclick="saveLocation()">儲存據點</button>
        <button class="btn-start" onclick="startSystem()">▶ 啟動接收與語音</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>登記時間</th><th>來訪目的</th><th>訪客姓名</th><th>公司名稱</th>
                <th>總人數</th><th>連絡電話</th><th>受訪部門</th><th>受訪人</th>
            </tr>
        </thead>
        <tbody id="recordBody"></tbody>
    </table>
</div>

<div class="admin-trigger" onclick="openAdminModal()">⚙️ 高級管理後台</div>

<div id="adminModal" class="modal">
    <div class="modal-box">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #eee; padding-bottom:10px;">
            <h2 style="margin:0;">⚙️ 高級管理後台</h2>
            <button onclick="closeAdminModal()" style="background:#95a5a6; color:white; padding:5px 15px;">關閉</button>
        </div>
        
        <div class="admin-panel">
            <div class="admin-section">
                <h3>📥 匯出 Excel</h3>
                <button onclick="exportToExcel()" style="background:#27ae60; color:white; width:100%; margin-top:10px;">產生並下載試算表</button>
            </div>
            <div class="admin-section">
                <h3>🗑️ 刪除紀錄</h3>
                <p style="color:red; font-size:12px;">※ 刪除後無法復原</p>
                <button onclick="clearAllRecords()" style="background:#e74c3c; color:white; width:100%;">清空本地所有紀錄</button>
            </div>
            <div class="admin-section" style="grid-column: span 2;">
                <h3>🔑 變更管理員密碼</h3>
                <input type="password" id="newPwInput" placeholder="請輸入新密碼" style="width: 60%;">
                <button onclick="changePassword()" style="background:#f39c12; color:white;">確認變更</button>
            </div>
        </div>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycby6UO89plqJzmURWl26XCqoc4p9q1jRUp7TWKu1RM34WDluu2oxMdEffvXSAUHOFTmF/exec";
    let pollingInterval;

    window.onload = function() {
        checkLoginStatus();
        const savedLoc = localStorage.getItem('mic_location') || '新竹 6F';
        document.getElementById('admin_loc').value = savedLoc;
        document.getElementById('displayLocation').innerText = "- " + savedLoc + " -";
        renderTable();
    };

    // ================= 密碼防護邏輯 =================
    function checkLoginStatus() {
        const savedPw = localStorage.getItem('mic_admin_pw');
        const overlay = document.getElementById('loginOverlay');
        const title = document.getElementById('loginTitle');
        const hint = document.getElementById('loginHint');
        
        overlay.style.display = 'flex'; // 強制開啟遮罩
        document.getElementById('adminPw').focus();

        if (!savedPw) {
            title.innerText = "🆕 首次啟用設定";
            hint.innerText = "請為您的管理看板設定一組新密碼";
        } else {
            title.innerText = "🔒 系統登入";
            hint.innerText = "請輸入管理員密碼";
        }
    }

    function verifyLogin() {
        const inputPw = document.getElementById('adminPw').value;
        const savedPw = localStorage.getItem('mic_admin_pw');

        if (!inputPw) { alert("請輸入密碼！"); return; }

        if (!savedPw) {
            // 首次設定
            localStorage.setItem('mic_admin_pw', inputPw);
            alert("✅ 密碼設定成功！請牢記此密碼。");
            document.getElementById('loginOverlay').style.display = 'none';
        } else {
            // 驗證密碼
            if (inputPw === savedPw) {
                document.getElementById('loginOverlay').style.display = 'none';
            } else {
                alert("❌ 密碼錯誤，請重新輸入！");
                document.getElementById('adminPw').value = "";
            }
        }
    }

    function changePassword() {
        const newPw = document.getElementById('newPwInput').value;
        if (!newPw) { alert("新密碼不能為空！"); return; }
        localStorage.setItem('mic_admin_pw', newPw);
        alert("✅ 密碼已成功變更！");
        document.getElementById('newPwInput').value = "";
    }
    // ================================================

    function saveLocation() {
        const loc = document.getElementById('admin_loc').value.trim();
        localStorage.setItem('mic_location', loc);
        document.getElementById('displayLocation').innerText = "- " + loc + " -";
        alert("✅ 據點名稱已更新！");
    }

    function openAdminModal() { document.getElementById('adminModal').style.display = 'flex'; }
    function closeAdminModal() { document.getElementById('adminModal').style.display = 'none'; }

    function startSystem() {
        document.getElementById('connStatus').innerText = "🟢 正在即時監測中...";
        document.getElementById('connStatus').style.color = "#27ae60";
        document.getElementById('statusDot').classList.add('status-online');
        if(pollingInterval) clearInterval(pollingInterval);
        pollingInterval = setInterval(fetchCloudData, 5000);
        const msg = new SpeechSynthesisUtterance("系統啟動成功");
        msg.lang = 'zh-TW';
        window.speechSynthesis.speak(msg);
    }

    function fetchCloudData() {
        const loc = document.getElementById('admin_loc').value;
        fetch(`${GAS_URL}?loc=${loc}`)
            .then(res => res.json())
            .then(data => {
                if(data.success && data.data.length > 0) {
                    let localRecords = JSON.parse(localStorage.getItem('mic_visitor_logs') || '[]');
                    data.data.forEach(newRecord => {
                        localRecords.push(newRecord);
                        playVoiceNotify(newRecord.name, newRecord.host);
                    });
                    localStorage.setItem('mic_visitor_logs', JSON.stringify(localRecords));
                    renderTable();
                }
            }).catch(err => console.log("同步中..."));
    }

    function playVoiceNotify(name, host) {
        const text = `提醒，訪客 ${name} 先生已報到，受訪人 ${host}`;
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'zh-TW';
        utter.rate = 0.9;
        window.speechSynthesis.speak(utter);
    }

    function renderTable() {
        const records = JSON.parse(localStorage.getItem('mic_visitor_logs') || '[]');
        const body = document.getElementById('recordBody');
        if (records.length === 0) {
            body.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#999; padding: 40px;">目前尚無任何訪客紀錄</td></tr>';
        } else {
            const sortedRecords = [...records].reverse();
            body.innerHTML = sortedRecords.map((r, index) => `
                <tr class="${index === 0 ? 'new-row' : ''}">
                    <td>${r.time}</td><td>${r.purpose}</td><td style="font-weight:bold;">${r.name}</td>
                    <td>${r.company}</td><td>${r.people}</td><td>${r.phone}</td>
                    <td>${r.dept}</td><td><span style="color:#c0392b;font-weight:bold;">${r.host}</span></td>
                </tr>
            `).join('');
        }
    }

    function exportToExcel() {
        let records = JSON.parse(localStorage.getItem('mic_visitor_logs') || '[]');
        if(records.length === 0) { alert("沒有資料可匯出！"); return; }
        const ws = XLSX.utils.json_to_sheet(records);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "訪客紀錄");
        XLSX.writeFile(wb, "MIC_訪客紀錄匯出.xlsx");
    }

    function clearAllRecords() {
        if(confirm("⚠️ 警告：確定要刪除這台設備上所有的歷史紀錄嗎？")) {
            localStorage.removeItem('mic_visitor_logs');
            renderTable();
            alert("✅ 已清空");
        }
    }
</script>
</body>
</html>
