<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MIC 帆宣系統科技訪客登記表</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --primary: #2c3e50; --secondary: #3498db; --bg: #f4f7f6; }
        body { 
            font-family: "Microsoft JhengHei", sans-serif; background: #f0f2f5; margin: 0; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; width: 100vw; position: relative;
            box-sizing: border-box; overflow-x: hidden;
        }

        .header-area {
            width: 100%; padding: 20px; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: start;
            position: relative; z-index: 10;
        }
        
        .header-title { text-align: left; flex: 1; margin-right: 20px; }
        .header-mic { color: red; font-weight: bold; font-size: 36px; font-family: Arial, sans-serif; line-height: 1; }
        .header-sub { color: #c0392b; font-weight: bold; font-size: 18px; margin-top: 5px; }
        .header-location { color: #7f8c8d; font-size: 14px; margin-top: 3px; font-weight: bold; }

        #qrcode-container { 
            text-align: center; background: white; padding: 10px; 
            border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: block; 
        }

        /* 雙排網格設計 */
        .form-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;
        }
        
        @media (max-width: 768px) {
            .header-area { flex-direction: column; align-items: center; text-align: center; padding-bottom: 0; }
            .header-title { margin-right: 0; text-align: center; }
            #qrcode-container { display: none !important; }
            .form-grid { grid-template-columns: 1fr; gap: 15px; }
            /* 【防護一】手機螢幕寬度下，強制隱藏管理者按鈕 */
            .admin-trigger { display: none !important; }
        }

        .container { 
            background: white; width: 85%; max-width: 700px; padding: 40px; 
            border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            text-align: center; margin-top: 20px; margin-bottom: 20px;
        }

        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        h2 { color: #34495e; font-size: 24px; margin-bottom: 30px; font-weight: bold; }
        
        .radio-group { display: inline-block; text-align: left; margin-bottom: 30px; }
        .radio-item { font-size: 18px; margin: 15px 0; display: flex; align-items: center; cursor: pointer; color: #444; }
        .radio-item input { transform: scale(1.5); margin-right: 15px; cursor: pointer; }

        input[type="text"], input[type="number"] { 
            width: 100%; padding: 15px; font-size: 15px; border: 1px solid #ddd; 
            border-radius: 10px; background: #fff; box-sizing: border-box; margin: 0;
            outline: none; transition: border 0.3s;
        }
        input[type="text"]:focus { border-color: #3498db; }

        /* 人數增減按鈕樣式 */
        .stepper-container {
            display: flex; align-items: center; justify-content: space-between;
            border: 1px solid #ddd; border-radius: 10px; padding: 5px 15px;
            background: #fff; width: 100%; box-sizing: border-box; height: 52px;
        }
        .stepper-label { color: #757575; font-size: 14px; text-align: left; }
        .stepper-controls { display: flex; align-items: center; gap: 15px; }
        .btn-step {
            width: 32px; height: 32px; background: #3498db; color: white; border: none;
            border-radius: 50%; font-size: 20px; font-weight: bold; line-height: 1;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .btn-step:active { transform: scale(0.9); }
        #v_people {
            width: 40px; text-align: center; border: none; font-size: 18px; font-weight: bold;
            background: transparent; color: #444; padding: 0; pointer-events: none;
        }
        
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        button.action-btn { flex: 1; padding: 15px; font-size: 18px; font-weight: bold; cursor: pointer; border: none; border-radius: 10px; transition: 0.2s; }
        .btn-next { background: #3498db; color: white; }
        .btn-back { background: #95a5a6; color: white; }
        button.action-btn:active { transform: scale(0.98); }
        
        .loading { display: none; color: #e67e22; font-weight: bold; margin-top: 15px; }
        
        .admin-trigger { 
            margin: 20px 0 40px 0; cursor: pointer; color: #999; font-size: 14px; 
            font-weight: bold; display: flex; align-items: center; justify-content: center; z-index: 100;
        }
    </style>
</head>
<body>

<div class="header-area">
    <div class="header-title">
        <div class="header-mic">MIC</div>
        <div class="header-sub">帆宣系統科技訪客登記表</div>
        <div class="header-location" id="displayLocation">- 載入中 -</div>
    </div>

    <div id="qrcode-container">
        <div id="qrcode"></div>
        <div style="font-size: 12px; color: #666; margin-top: 5px;">手機掃碼登記</div>
    </div>
</div>

<div class="container">
    <div id="step1" class="step active">
        <h2>來訪目的 / Purpose / 訪問目的</h2>
        <div class="radio-group">
            <label class="radio-item"><input type="radio" name="purpose" value="拜訪 / Visit" checked> 拜訪 / Visit / 訪問</label>
            <label class="radio-item"><input type="radio" name="purpose" value="面試 / Interview"> 面試 / Interview / 面接</label>
            <label class="radio-item"><input type="radio" name="purpose" value="報到 / Onboarding"> 報到 / Onboarding / 入社</label>
            <label class="radio-item"><input type="radio" name="purpose" value="施工 / Construction"> 施工 / Construction / 工事</label>
            <label class="radio-item"><input type="radio" name="purpose" value="其他 / Other"> 其他 / Other / その他</label>
        </div>
        <div class="btn-group">
            <button class="action-btn btn-next" onclick="goToStep2()">下一步 / Next / 次へ</button>
        </div>
    </div>

    <div id="step2" class="step">
        <h2>詳細資訊 / Details / 詳細情報</h2>
        
        <div class="form-grid">
            <input type="text" id="v_name" placeholder="代表姓名 / Name / 名前 (必填)">
            <input type="text" id="v_host" placeholder="受訪人姓名 / Host / 訪問先名 (必填)">
            
            <input type="text" id="v_company" placeholder="公司名稱 / Company / 会社名">
            <input type="text" id="v_dept" placeholder="受訪部門 / Dept. / 部署">
            
            <input type="text" id="v_phone" placeholder="連絡電話 / Phone / 電話番号">
            
            <div class="stepper-container" id="people_wrapper">
                <div class="stepper-label">總人數 / People / 人数</div>
                <div class="stepper-controls">
                    <button type="button" class="btn-step btn-minus" onclick="changePeople(-1)">-</button>
                    <input type="number" id="v_people" value="1" min="1" readonly>
                    <button type="button" class="btn-step btn-plus" onclick="changePeople(1)">+</button>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button class="action-btn btn-back" onclick="goToStep(1)">回上一步 / Back / 戻る</button>
            <button class="action-btn btn-next" onclick="submitData()">確認送出 / Submit / 送信</button>
        </div>
        <div id="loadingMsg" class="loading">正在儲存至系統中...</div>
    </div>
</div>

<div class="admin-trigger" id="adminBtn" onclick="location.href='tablet.html'">
    ⚙️ 管理者 / Admin
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycby6UO89plqJzmURWl26XCqoc4p9q1jRUp7TWKu1RM34WDluu2oxMdEffvXSAUHOFTmF/exec";

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const urlLoc = urlParams.get('loc'); 
        
        // 【防護二】如果網址帶有 loc 參數 (代表是掃描 QR Code 進來的)，徹底隱藏管理者按鈕
        if (urlLoc) {
            const adminBtn = document.getElementById('adminBtn');
            if (adminBtn) adminBtn.style.display = 'none';
        }
        
        const currentLoc = urlLoc || localStorage.getItem('mic_location') || '新竹 6F-3';
        document.getElementById('displayLocation').innerText = "- " + currentLoc + " -";
        
        const baseUrl = window.location.origin + window.location.pathname;
        const qrUrl = baseUrl + "?loc=" + encodeURIComponent(currentLoc);
        
        new QRCode(document.getElementById("qrcode"), { text: qrUrl, width: 100, height: 100 });
    };

    function goToStep(s) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('step' + s).classList.add('active');
    }

    function goToStep2() {
        const purpose = document.querySelector('input[name="purpose"]:checked').value;
        
        const fName = document.getElementById('v_name');
        const fHost = document.getElementById('v_host');
        const fComp = document.getElementById('v_company');
        const fDept = document.getElementById('v_dept');
        const iPeople = document.getElementById('v_people');
        const btnSteps = document.querySelectorAll('.btn-step');

        fHost.style.display = 'block'; fHost.value = '';
        fComp.style.display = 'block'; fComp.value = '';
        fDept.style.display = 'block'; fDept.value = '';
        btnSteps.forEach(btn => btn.style.display = 'flex');
        iPeople.value = 1;

        if (purpose.includes("拜訪")) {
            fName.placeholder = "代表姓名 / Name / 名前 (必填)";
            fHost.placeholder = "受訪人姓名 / Host / 訪問先名 (必填)";
            fComp.placeholder = "公司名稱 / Company / 会社名 (非必填)";
            fDept.placeholder = "受訪部門 / Dept. / 部署 (非必填)";
        } 
        else if (purpose.includes("面試")) {
            fName.placeholder = "面試者姓名 / Candidate / 面接者名 (必填)";
            fComp.style.display = 'none';
            fDept.style.display = 'none';
            fHost.style.display = 'none'; fHost.value = '-'; 
            btnSteps.forEach(btn => btn.style.display = 'none');
        } 
        else if (purpose.includes("報到")) {
            fName.placeholder = "報到者姓名 / New Hire / 入社者名 (必填)";
            fComp.style.display = 'none';
            fDept.style.display = 'none';
            fHost.style.display = 'none'; fHost.value = '-'; 
            btnSteps.forEach(btn => btn.style.display = 'none');
        } 
        else if (purpose.includes("施工")) {
            fName.placeholder = "代表姓名 / Name / 名前 (必填)";
            fHost.placeholder = "受訪人姓名 / Host / 訪問先名 (必填)";
            fComp.placeholder = "公司名稱 / Company / 会社名";
            fDept.style.display = 'none';
        } 
        else {
            fName.placeholder = "代表姓名 / Name / 名前 (必填)";
            fHost.placeholder = "受訪人姓名 / Host / 訪問先名 (必填)";
            fComp.placeholder = "公司名稱 / Company / 会社名";
            fDept.placeholder = "受訪部門 / Dept. / 部署";
        }

        goToStep(2);
    }

    function changePeople(delta) {
        const input = document.getElementById('v_people');
        let val = parseInt(input.value) + delta;
        if(val < 1) val = 1;
        input.value = val;
    }

    function submitData() {
        const name = document.getElementById('v_name').value.trim();
        const host = document.getElementById('v_host').value.trim();
        const isHostVisible = document.getElementById('v_host').style.display !== 'none';
        
        if(!name || (isHostVisible && !host)) { 
            alert("請填寫必填欄位！ / Please fill in required fields."); 
            return; 
        }

        document.getElementById('loadingMsg').style.display = 'block';
        
        const urlParams = new URLSearchParams(window.location.search);
        const loc = urlParams.get('loc') || localStorage.getItem('mic_location') || '新竹 6F-3'; 

        const now = new Date();
        const record = {
            loc: loc,
            time: `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}-${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`,
            purpose: document.querySelector('input[name="purpose"]:checked').value,
            name: name,
            company: document.getElementById('v_company').value || "-",
            people: document.getElementById('v_people').value || "1",
            phone: document.getElementById('v_phone').value || "-",
            dept: document.getElementById('v_dept').value || "-",
            host: host || "-"
        };

        fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify(record)
        }).then(res => res.json()).then(data => {
            if(data.success) {
                alert("✅ 登記完成，謝謝！ / Submitted successfully!");
                location.reload();
            }
        }).catch(err => {
            alert("⚠️ 傳送失敗，請重試。 / Submission failed, please try again.");
            document.getElementById('loadingMsg').style.display = 'none';
        });
    }
</script>
</body>
</html>
