<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MIC 帆宣系統科技訪客登記表</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --primary: #2c3e50; --secondary: #3498db; --bg: #f4f7f6; }
        body { 
            font-family: "Microsoft JhengHei", sans-serif; background: #f0f2f5; margin: 0; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; width: 100vw; position: relative; overflow: hidden;
        }
        
        /* 還原左上角標題與動態據點 */
        .header-title { position: absolute; top: 20px; left: 20px; text-align: left; }
        .header-mic { color: red; font-weight: bold; font-size: 36px; font-family: Arial, sans-serif; line-height: 1; }
        .header-sub { color: #c0392b; font-weight: bold; font-size: 18px; margin-top: 5px; }
        .header-location { color: #7f8c8d; font-size: 14px; margin-top: 3px; font-weight: bold; }

        /* 還原右上方 QR Code */
        #qrcode-container { 
            position: absolute; top: 20px; right: 20px; text-align: center; 
            background: white; padding: 10px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }

        /* 還原右下角管理者入口 */
        .admin-trigger { 
            position: absolute; bottom: 20px; right: 20px; cursor: pointer; 
            color: #999; font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 5px;
            z-index: 100;
        }

        .container { 
            background: white; width: 85%; max-width: 600px; padding: 50px 40px; 
            border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            text-align: center;
        }

        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        h2 { color: #34495e; font-size: 26px; margin-bottom: 30px; font-weight: bold; }

        .radio-group { display: inline-block; text-align: left; margin-bottom: 40px; }
        .radio-item { font-size: 20px; margin: 20px 0; display: flex; align-items: center; cursor: pointer; color: #444; }
        .radio-item input { transform: scale(1.6); margin-right: 15px; cursor: pointer; }

        input[type="text"], input[type="number"] { 
            width: 95%; padding: 15px; font-size: 18px; border: 1px solid #ddd; 
            border-radius: 10px; margin-bottom: 20px; background: #fff; box-sizing: border-box;
        }
        
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        button { flex: 1; padding: 15px; font-size: 18px; font-weight: bold; cursor: pointer; border: none; border-radius: 10px; transition: 0.2s; }
        .btn-next { background: #3498db; color: white; }
        .btn-back { background: #95a5a6; color: white; }
        button:active { transform: scale(0.98); }

        .loading { display: none; color: #e67e22; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

<div class="header-title">
    <div class="header-mic">MIC</div>
    <div class="header-sub">帆宣系統科技訪客登記表</div>
    <div class="header-location" id="displayLocation">- 載入中 -</div>
</div>

<div id="qrcode-container">
    <div id="qrcode"></div>
    <div style="font-size: 12px; color: #666; margin-top: 5px;">手機掃碼登記</div>
</div>

<div class="admin-trigger" onclick="location.href='tablet.html'">
    ⚙️ 管理者 / Admin
</div>

<div class="container">
    <div id="step1" class="step active">
        <h2>來訪名稱 / Purpose</h2>
        <div class="radio-group">
            <label class="radio-item"><input type="radio" name="purpose" value="拜訪 / Visit" checked> 拜訪 / Visit</label>
            <label class="radio-item"><input type="radio" name="purpose" value="面試 / Interview"> 面試 / Interview</label>
            <label class="radio-item"><input type="radio" name="purpose" value="報到 / Onboarding"> 報到 / Onboarding</label>
            <label class="radio-item"><input type="radio" name="purpose" value="施工 / Construction"> 施工 / Construction</label>
            <label class="radio-item"><input type="radio" name="purpose" value="其他 / Other"> 其他 / Other</label>
        </div>
        <div class="btn-group">
            <button class="btn-next" onclick="nextStep(2)">下一步 / Next</button>
        </div>
    </div>

    <div id="step2" class="step">
        <h2>訪客資訊 / Visitor Info</h2>
        <input type="text" id="v_name" placeholder="代表姓名 / Name">
        <input type="text" id="v_company" placeholder="公司名稱 / Company">
        <input type="number" id="v_people" value="1" min="1" placeholder="總人數">
        <div class="btn-group">
            <button class="btn-back" onclick="nextStep(1)">回上一步 / Back</button>
            <button class="btn-next" onclick="nextStep(3)">下一步 / Next</button>
        </div>
    </div>

    <div id="step3" class="step">
        <h2>受訪資訊 / Host Info</h2>
        <input type="text" id="v_phone" placeholder="連絡電話 / Phone">
        <input type="text" id="v_dept" placeholder="受訪部門 / Dept">
        <input type="text" id="v_host" placeholder="受訪人姓名 / Host">
        <div class="btn-group">
            <button class="btn-back" onclick="nextStep(2)">回上一步 / Back</button>
            <button class="btn-next" onclick="submitData()">確認送出 / Finish</button>
        </div>
        <div id="loadingMsg" class="loading">正在儲存至系統中...</div>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycby6UO89plqJzmURWl26XCqoc4p9q1jRUp7TWKu1RM34WDluu2oxMdEffvXSAUHOFTmF/exec";

    window.onload = function() {
        // 抓取之前在管理後台儲存的據點名稱
        const savedLoc = localStorage.getItem('mic_location') || '新竹 6F';
        document.getElementById('displayLocation').innerText = "- " + savedLoc + " -";
        
        // 產生 QR Code
        new QRCode(document.getElementById("qrcode"), {
            text: window.location.href,
            width: 100,
            height: 100
        });
    };

    function nextStep(s) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('step' + s).classList.add('active');
    }

    function submitData() {
        const name = document.getElementById('v_name').value.trim();
        const host = document.getElementById('v_host').value.trim();
        if(!name || !host) { alert("請填寫姓名與受訪人！"); return; }

        document.getElementById('loadingMsg').style.display = 'block';
        const urlParams = new URLSearchParams(window.location.search);
        const loc = urlParams.get('loc') || localStorage.getItem('mic_location') || 'Toufen'; 

        const now = new Date();
        const record = {
            loc: loc,
            time: `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}-${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`,
            purpose: document.querySelector('input[name="purpose"]:checked').value,
            name: name,
            company: document.getElementById('v_company').value || "-",
            people: document.getElementById('v_people').value || "1",
            phone: document.getElementById('v_phone').value || "-",
            dept: document.getElementById('v_dept').value || "-",
            host: host
        };

        fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify(record)
        }).then(res => res.json()).then(data => {
            if(data.success) {
                alert("✅ 登記完成，謝謝！");
                location.reload();
            }
        }).catch(err => {
            alert("⚠️ 傳送失敗，請重試。");
            document.getElementById('loadingMsg').style.display = 'none';
        });
    }
</script>
</body>
</html>
